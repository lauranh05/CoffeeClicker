<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="coffee.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <title>CoffeeClicker</title>
</head>
<body>
    <main>
        <div id="menu" class="menu">
            <button id="btn-start"></button>
        </div>

        <div id="game" class="game">
            <button id="btn-clicker"></button>
            <button id="btn-back"></button>
            <div id="cup" class="cup"></div>
        </div>

        <div>
            <button id="btn-profile" class="btn left"></button>
            <div class="right">
                <button id="btn-music" class="btn"></button>
                <button id="btn-config" class="btn"></button>
            </div>
            <button id="btn-statics" class="btn rightUp"></button>
        </div>

        <div class="mobileScreen">
            <p>Sorry, this game is only avaliable in devices >1000px</p>
        </div>

        <div class="idClass">
            <img src="images/id.png" alt="id" id="idPaper">
        </div>

        <div id="noback"></div>

        <div id="ticketClass">
            <p id="textTC">Total Clicks: </p>
            <br>
            <p id="textCC">Coffees Completed:</p>
            <br>
            <p id="textC">Total Coins: </p>
            <button id="closeTicket"></button>
        </div>

        <div id="settingClass">
            <button id="closeSetting"></button>
        </div>
    </main>
</body>
<script src="coffee.js"></script>
</html>
